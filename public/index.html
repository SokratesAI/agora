<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agora</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #111214;
      color: #e8e8e8;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid #26272b;
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    #status { font-size: 0.75rem; color: #8a8a8a; }
    .header-conversations {
      display: flex;
      gap: 0.5rem;
    }
    #conversation-select {
      flex: 1;
      min-width: 0;
      border-radius: 0.7rem;
      border: 1px solid #333;
      background: #1a1b1e;
      color: #e8e8e8;
      padding: 0.4rem 0.6rem;
      font: inherit;
      font-size: 0.85rem;
    }
    #new-chat-toggle {
      padding: 0.4rem 0.75rem;
      border-radius: 0.7rem;
      font-size: 0.9rem;
      line-height: 1;
    }
    #new-chat-form {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #26272b;
      background: #17181b;
      flex: none;
    }
    #new-chat-form[hidden] { display: none; }
    #new-chat-form input,
    #new-chat-form textarea,
    #new-chat-form select {
      border-radius: 0.7rem;
      border: 1px solid #333;
      background: #1a1b1e;
      color: #e8e8e8;
      padding: 0.5rem 0.7rem;
      font: inherit;
      font-size: 0.9rem;
      resize: none;
    }
    .new-chat-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    #new-chat-model { flex: 1; min-width: 0; }
    .new-chat-checkbox {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: #c7c8cc;
      white-space: nowrap;
    }
    .new-chat-checkbox[hidden] { display: none; }
    .new-chat-checkbox input { width: 1rem; height: 1rem; }
    #new-chat-form .new-chat-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }
    #new-chat-cancel {
      background: #2a2b30;
    }
    #new-chat-status { font-size: 0.75rem; color: #8a8a8a; min-height: 1em; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .bubble {
      max-width: 78%;
      padding: 0.45rem 0.75rem;
      border-radius: 1rem;
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
    }
    .bubble .meta {
      display: block;
      font-size: 0.65rem;
      opacity: 0.65;
      margin-bottom: 0.15rem;
    }
    .bubble.mine {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 0.3rem;
    }
    .bubble.theirs {
      align-self: flex-start;
      background: #262830;
      color: #e8e8e8;
      border-bottom-left-radius: 0.3rem;
    }
    #empty { color: #666; text-align: center; margin-top: 2rem; font-size: 0.9rem; }
    form {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      padding: 0.6rem;
      border-top: 1px solid #26272b;
      flex: none;
    }
    textarea {
      flex: 1;
      resize: none;
      max-height: 6rem;
      border-radius: 0.9rem;
      border: 1px solid #333;
      background: #1a1b1e;
      color: #e8e8e8;
      padding: 0.55rem 0.85rem;
      font: inherit;
      line-height: 1.3;
    }
    textarea:focus { outline: 1px solid #2563eb; }
    button {
      border: none;
      border-radius: 0.9rem;
      background: #2563eb;
      color: #fff;
      padding: 0.6rem 1.1rem;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Agora</h1>
      <span id="status"></span>
    </div>
    <div class="header-conversations">
      <select id="conversation-select"><option value="">Main</option></select>
      <button type="button" id="new-chat-toggle" title="New chat">+ New</button>
    </div>
  </header>
  <form id="new-chat-form" hidden>
    <input id="new-chat-name" type="text" placeholder="Name (e.g. Marcus)" required />
    <textarea id="new-chat-personality" placeholder="Personality / system prompt (optional)..." rows="2"></textarea>
    <div class="new-chat-row">
      <select id="new-chat-model"></select>
      <label id="new-chat-thinking-row" class="new-chat-checkbox">
        <input type="checkbox" id="new-chat-thinking" />
        Thinking
      </label>
    </div>
    <p id="new-chat-status"></p>
    <div class="new-chat-actions">
      <button type="button" id="new-chat-cancel">Cancel</button>
      <button type="submit">Create</button>
    </div>
  </form>
  <div id="messages"><p id="empty">No messages yet.</p></div>
  <form id="reply-form">
    <textarea id="reply-text" placeholder="Message..." rows="1"></textarea>
    <button type="submit">Send</button>
  </form>
  <script src="/app.js"></script>
</body>
</html>
