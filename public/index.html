<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agora</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" />
  <style>
    /* Visual redesign 2026-07-20, modeled on the ChatGPT mobile app
       (Edvard's reference screenshots): plain-text assistant replies (no
       bubble), a slide-in drawer for conversation switching/search instead
       of a header dropdown, a bottom-sheet action menu per conversation,
       icon-only message actions, and a pill-shaped input bar. Same
       light/dark theme variables as before, tuned to look closer to the
       reference (neutral gray user bubble, not blue — blue reserved for
       the send button and other single primary actions). */
    :root, :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #131314;
      --bg-raised: #1e1f20;
      --bg-input: #242426;
      --border: #2c2d2f;
      --text: #e8e8e8;
      --text-dim: #9a9a9a;
      --text-dimmer: #6b6b6b;
      --accent: #2563eb;
      --bubble-mine: #2c2d2f;
      --danger: #f87171;
      --overlay: rgba(0,0,0,0.55);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --bg-raised: #ffffff;
      --bg-input: #f4f4f5;
      --border: #e5e5e7;
      --text: #1a1a1a;
      --text-dim: #6b6b6b;
      --text-dimmer: #a0a0a3;
      --accent: #2563eb;
      --bubble-mine: #f0f0f1;
      --danger: #dc2626;
      --overlay: rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* --- Top bar ---------------------------------------------------- */
    header {
      padding: 0.6rem 0.75rem;
      flex: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .round-button {
      flex: none;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      border: none;
      background: none;
      color: var(--text);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .round-button:hover { background: var(--bg-input); }
    #header-title {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status { display: none; } /* transient status now shown as a toast-ish line under the title on demand */
    #status.visible {
      display: block;
      position: absolute;
      top: 3rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    /* --- Drawer ------------------------------------------------------ */
    #drawer-scrim {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 20;
    }
    #drawer-scrim[hidden] { display: none; }
    #drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: min(85vw, 320px);
      background: var(--bg-raised);
      border-right: 1px solid var(--border);
      z-index: 21;
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
      gap: 0.5rem;
    }
    #drawer[hidden] { display: none; }
    .drawer-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.4rem 0.6rem;
    }
    .drawer-header h1 { font-size: 1.05rem; margin: 0; flex: 1; }
    #drawer-search-input {
      width: 100%;
      border-radius: 0.7rem;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      padding: 0.5rem 0.7rem;
      font: inherit;
      font-size: 0.85rem;
    }
    #drawer-new-chat {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-radius: 0.7rem;
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 0.55rem 0.8rem;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .drawer-section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-dimmer);
      padding: 0.6rem 0.5rem 0.2rem;
    }
    #drawer-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }
    .drawer-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-radius: 0.6rem;
      padding: 0.55rem 0.5rem;
      cursor: pointer;
    }
    .drawer-row:hover { background: var(--bg-input); }
    .drawer-row.active { background: var(--bg-input); }
    .drawer-row-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.88rem;
    }
    .drawer-row-more {
      flex: none;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
      cursor: pointer;
      border-radius: 0.4rem;
    }
    .drawer-row-more:hover { background: var(--border); }
    #drawer-search-results { display: flex; flex-direction: column; gap: 0.1rem; }
    .search-hit {
      display: flex;
      flex-direction: column;
      border-radius: 0.6rem;
      padding: 0.5rem;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .search-hit:hover { background: var(--bg-input); }
    .search-hit .hit-name { font-weight: 600; font-size: 0.72rem; color: var(--text-dim); }
    .drawer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem;
      border-top: 1px solid var(--border);
    }
    .drawer-footer button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 0.6rem;
      padding: 0.4rem 0.7rem;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* --- Floating action menus (conversation actions, message actions) --
       Small anchored popover cards rather than full-width bottom sheets —
       matches the ChatGPT mobile menu style (reference screenshots,
       2026-07-20). The scrim stays for click-outside-to-close but is
       transparent — the reference doesn't dim the background behind it. */
    .sheet-scrim {
      position: fixed;
      inset: 0;
      background: transparent;
      z-index: 30;
    }
    .sheet-scrim[hidden] { display: none; }
    .sheet {
      position: fixed;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 0.35rem;
      min-width: 230px;
      max-width: 300px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }
    /* Anchored under the header's ⋮ button — a fixed offset works because
       the header's height/padding never changes, no JS measurement needed. */
    #action-sheet { top: 3.6rem; right: 0.75rem; }
    /* Anchored to the long-pressed message instead — position set by JS
       (positionFloatingSheet in app.js) at open time, this is just a
       pre-paint fallback. */
    #msg-action-sheet { top: 0; left: 0; }
    .sheet-title {
      font-size: 0.78rem;
      color: var(--text-dim);
      padding: 0.55rem 0.7rem 0.3rem;
      font-weight: 600;
    }
    .sheet-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      width: 100%;
      background: none;
      border: none;
      border-radius: 0.6rem;
      color: var(--text);
      padding: 0.6rem 0.7rem;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
    }
    .sheet-row:hover { background: var(--bg-input); }
    .sheet-row.danger { color: var(--danger); }
    .sheet-row .sheet-icon { width: 1.3rem; flex: none; display: flex; align-items: center; justify-content: center; }
    .sheet-row[hidden] { display: none; }

    /* --- Modal (edit conversation / new chat) ------------------------- */
    .modal-scrim {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-scrim[hidden] { display: none; }
    .modal {
      width: 100%;
      max-width: 420px;
      background: var(--bg-raised);
      border-radius: 1rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal h2 { margin: 0 0 0.2rem; font-size: 1rem; }
    .modal input,
    .modal textarea,
    .modal select {
      width: 100%;
      border-radius: 0.7rem;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      padding: 0.5rem 0.7rem;
      font: inherit;
      font-size: 0.9rem;
      resize: none;
    }
    .modal-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .modal-row select { flex: 1; min-width: 0; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .checkbox-row[hidden] { display: none; }
    .checkbox-row input { width: 1rem; height: 1rem; }
    .capability-badge {
      font-size: 0.7rem;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.15rem 0.4rem;
      white-space: nowrap;
    }
    .template-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .template-chip {
      font-size: 0.75rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 1rem;
      padding: 0.25rem 0.65rem;
      cursor: pointer;
    }
    .modal-status { font-size: 0.75rem; color: var(--text-dim); min-height: 1em; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.2rem; }
    .modal-actions button {
      border: none;
      border-radius: 0.8rem;
      padding: 0.55rem 1rem;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--bg-input); color: var(--text); }

    /* --- Messages ------------------------------------------------------ */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .msg-block { display: flex; flex-direction: column; }
    .msg-block.mine { align-items: flex-end; }
    .msg-block.theirs { align-items: stretch; }
    .msg-meta {
      font-size: 0.7rem;
      color: var(--text-dimmer);
      margin-bottom: 0.2rem;
    }
    .msg-block.mine .msg-meta { text-align: right; }
    .msg-bubble.mine {
      max-width: 82%;
      background: var(--bubble-mine);
      color: var(--text);
      border-radius: 1.1rem;
      padding: 0.55rem 0.9rem;
      line-height: 1.4;
      word-break: break-word;
      font-size: 0.95rem;
    }
    /* Assistant replies render as plain text, no bubble, full column
       width — matches the reference screenshots directly. */
    .msg-plain {
      color: var(--text);
      line-height: 1.5;
      word-break: break-word;
      font-size: 0.95rem;
    }
    /* Both message bodies get a 2s press-and-hold action sheet (see
       attachLongPress in app.js) instead of always-visible icons — pan-y
       keeps vertical scrolling working, the rest suppresses iOS's native
       text-selection/callout menu so it doesn't fight the hold gesture. */
    .msg-bubble.mine, .msg-plain {
      touch-action: pan-y;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .msg-plain p { margin: 0 0 0.5rem; }
    .msg-plain p:last-child { margin-bottom: 0; }
    .msg-plain pre {
      background: var(--bg-input);
      padding: 0.6rem;
      border-radius: 0.6rem;
      overflow-x: auto;
      font-size: 0.8rem;
      margin: 0.4rem 0;
    }
    .msg-plain code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .msg-plain :not(pre) > code { background: var(--bg-input); padding: 0.1rem 0.3rem; border-radius: 0.3rem; }
    .msg-plain a { color: var(--accent); text-decoration: underline; }
    /* Save/Cancel row for the edit-in-place textarea only — the always-
       visible per-message icon row this used to also style is gone,
       replaced by the long-press sheet below. */
    .msg-edit-actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.3rem;
      justify-content: flex-end;
    }
    .msg-edit-actions button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dimmer);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.3rem 0.6rem;
      border-radius: 0.6rem;
      line-height: 1;
    }
    .msg-edit-actions button:hover { background: var(--bg-input); color: var(--text); }
    .msg-edit-area {
      width: 100%;
      font: inherit;
      font-size: 0.95rem;
      border-radius: 1.1rem;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      padding: 0.55rem 0.9rem;
      resize: none;
    }
    .typing-indicator { color: var(--text-dim); font-size: 0.8rem; padding: 0 0.2rem; max-width: 720px; width: 100%; margin: 0 auto; }
    .retry-banner {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 0.7rem;
      padding: 0.5rem 0.7rem;
      font-size: 0.8rem;
      color: var(--text-dim);
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .retry-banner select { font: inherit; background: var(--bg-input); color: var(--text); border: 1px solid var(--border); border-radius: 0.4rem; }
    .retry-banner button { font: inherit; background: var(--accent); color: #fff; border: none; border-radius: 0.4rem; padding: 0.25rem 0.6rem; cursor: pointer; }
    #empty { color: var(--text-dimmer); text-align: center; margin-top: 2rem; font-size: 0.9rem; }

    /* --- Input bar ------------------------------------------------------ */
    #composer {
      flex: none;
      padding: 0.6rem 0.75rem 0.85rem;
    }
    #reply-form {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 0.4rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 1.6rem;
      padding: 0.4rem 0.4rem 0.4rem 0.6rem;
      position: relative;
    }
    #plus-button, #send-button {
      flex: none;
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }
    #plus-button { background: none; color: var(--text-dim); }
    #plus-button:hover { background: var(--border); }
    #send-button { background: var(--accent); color: #fff; }
    #send-button:disabled { opacity: 0.4; cursor: default; }
    textarea#reply-text {
      flex: 1;
      resize: none;
      max-height: 8rem;
      min-height: 2.2rem;
      overflow-y: auto;
      border: none;
      background: none;
      color: var(--text);
      padding: 0.35rem 0.2rem;
      font: inherit;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    textarea#reply-text:focus { outline: none; }
    #attach-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      max-width: 720px;
      margin: 0 auto 0.4rem;
    }
    #attach-chip-row[hidden] { display: none; }
    .attach-chip {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 0.25rem 0.5rem;
      font-size: 0.78rem;
      color: var(--text);
      max-width: 12rem;
    }
    .attach-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attach-chip-remove { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 0; font-size: 0.9rem; line-height: 1; }

    /* Plus-button popover — anchored above the composer like the old
       model-popover was, styled after the ChatGPT mobile attach menu
       (circular icon badges + bold label per row). */
    #attach-menu {
      position: absolute;
      bottom: calc(100% + 0.5rem);
      left: 0.2rem;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 1.1rem;
      padding: 0.4rem;
      min-width: 210px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
      z-index: 10;
    }
    #attach-menu[hidden] { display: none; }
    .attach-menu-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      width: 100%;
      background: none;
      border: none;
      border-radius: 0.7rem;
      color: var(--text);
      padding: 0.35rem 0.5rem;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
    }
    .attach-menu-row:hover { background: var(--bg-input); }
    .attach-menu-icon {
      flex: none;
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 50%;
      background: var(--bg-input);
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <header>
    <button type="button" class="round-button" id="drawer-open" aria-label="Menu">☰</button>
    <div id="header-title">Main</div>
    <button type="button" class="round-button" id="header-new-chat" aria-label="New chat" title="New chat">
      <svg viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 6.5A2.5 2.5 0 0 1 6 4h11a2.5 2.5 0 0 1 2.5 2.5v6A2.5 2.5 0 0 1 17 15H9l-4 3v-3H6a2.5 2.5 0 0 1-2.5-2.5v-6Z"/>
        <path d="M15.5 3.5 20 8l-7.5 7.5H8V12L15.5 4.5Z" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button type="button" class="round-button" id="header-overflow" aria-label="Conversation actions" title="Conversation actions">⋮</button>
  </header>
  <span id="status"></span>

  <div id="drawer-scrim" hidden></div>
  <nav id="drawer" hidden>
    <div class="drawer-header">
      <h1>Agora</h1>
      <button type="button" class="round-button" id="drawer-close" aria-label="Close menu">✕</button>
    </div>
    <input id="drawer-search-input" type="text" placeholder="Search conversations and messages" />
    <button type="button" id="drawer-new-chat">＋ New chat</button>
    <div id="drawer-search-results" hidden></div>
    <div id="drawer-list-wrap">
      <div class="drawer-section-label">Conversations</div>
      <div id="drawer-list"></div>
    </div>
    <div class="drawer-footer">
      <button type="button" id="theme-toggle">Toggle theme</button>
    </div>
  </nav>

  <div class="sheet-scrim" id="action-sheet-scrim" hidden>
    <div class="sheet" id="action-sheet">
      <div class="sheet-title" id="action-sheet-title">Conversation</div>
      <button type="button" class="sheet-row" id="sheet-edit">
        <span class="sheet-icon"><svg viewBox="0 0 24 24" width="1rem" height="1rem" fill="currentColor"><path d="M15.5 3.5 20 8l-11 11H4v-5L15.5 3.5Z"/></svg></span>
        Edit (name, personality, model)
      </button>
      <button type="button" class="sheet-row" id="sheet-archive">
        <span class="sheet-icon"><svg viewBox="0 0 24 24" width="1.05rem" height="1.05rem" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="4.5" rx="1.2"/><path d="M4.5 8.5V18a1.8 1.8 0 0 0 1.8 1.8h11.4a1.8 1.8 0 0 0 1.8-1.8V8.5"/><path d="M10 13h4"/></svg></span>
        <span id="sheet-archive-label">Archive</span>
      </button>
      <button type="button" class="sheet-row danger" id="sheet-delete">
        <span class="sheet-icon"><svg viewBox="0 0 24 24" width="1.05rem" height="1.05rem" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.8A1.8 1.8 0 0 1 10.8 3h2.4A1.8 1.8 0 0 1 15 4.8V7"/><path d="M6 7l1 12.5A1.8 1.8 0 0 0 8.8 21h6.4a1.8 1.8 0 0 0 1.8-1.5L18 7"/><path d="M10 11v6M14 11v6"/></svg></span>
        Delete
      </button>
      <!-- "Main" (currentConversationId === null) has no backend conversation
           record, so it can't be renamed/archived/deleted like a real
           conversation — this row is the only one shown for it. -->
      <button type="button" class="sheet-row" id="sheet-main-model" hidden>
        <span class="sheet-icon"><svg viewBox="0 0 24 24" width="1.05rem" height="1.05rem" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></span>
        Choose default model
      </button>
    </div>
  </div>

  <div class="modal-scrim" id="main-model-modal-scrim" hidden>
    <form class="modal" id="main-model-modal">
      <h2>Default model for Main</h2>
      <select id="main-model-select"></select>
      <p class="modal-status" id="main-model-status"></p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="main-model-cancel">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>

  <div class="modal-scrim" id="edit-modal-scrim" hidden>
    <form class="modal" id="edit-modal">
      <h2>Edit conversation</h2>
      <input id="edit-name" type="text" placeholder="Name" />
      <div class="template-row" id="edit-template-row"></div>
      <textarea id="edit-personality" placeholder="Personality / system prompt..." rows="3"></textarea>
      <div class="modal-row">
        <select id="edit-model"></select>
        <span class="capability-badge" id="edit-badge"></span>
      </div>
      <label class="checkbox-row" id="edit-thinking-row">
        <input type="checkbox" id="edit-thinking" />
        Thinking
      </label>
      <p class="modal-status" id="edit-status"></p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="edit-cancel">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>

  <div class="modal-scrim" id="new-chat-modal-scrim" hidden>
    <form class="modal" id="new-chat-modal">
      <h2>New conversation</h2>
      <input id="new-chat-name" type="text" placeholder="Name (e.g. Marcus)" required />
      <div class="template-row" id="new-chat-template-row"></div>
      <textarea id="new-chat-personality" placeholder="Personality / system prompt (optional)..." rows="3"></textarea>
      <div class="modal-row">
        <select id="new-chat-model"></select>
        <span class="capability-badge" id="new-chat-badge"></span>
      </div>
      <label class="checkbox-row" id="new-chat-thinking-row">
        <input type="checkbox" id="new-chat-thinking" />
        Thinking
      </label>
      <p class="modal-status" id="new-chat-status"></p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="new-chat-cancel">Cancel</button>
        <button type="submit" class="btn-primary">Create</button>
      </div>
    </form>
  </div>

  <div class="sheet-scrim" id="msg-action-sheet-scrim" hidden>
    <div class="sheet" id="msg-action-sheet">
      <button type="button" class="sheet-row" id="msg-sheet-copy">
        <span class="sheet-icon"><svg viewBox="0 0 24 24" width="1.05rem" height="1.05rem" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></span>
        Copy
      </button>
      <button type="button" class="sheet-row" id="msg-sheet-edit" hidden>
        <span class="sheet-icon"><svg viewBox="0 0 24 24" width="1.05rem" height="1.05rem" fill="currentColor"><path d="M15.5 3.5 20 8l-11 11H4v-5L15.5 3.5Z"/></svg></span>
        Edit
      </button>
      <button type="button" class="sheet-row" id="msg-sheet-regen" hidden>
        <span class="sheet-icon"><svg viewBox="0 0 24 24" width="1.05rem" height="1.05rem" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/></svg></span>
        Regenerate
      </button>
      <button type="button" class="sheet-row" id="msg-sheet-fork">
        <span class="sheet-icon"><svg viewBox="0 0 16 16" width="1rem" height="1rem" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="4" cy="3" r="1.5"/><circle cx="12" cy="3" r="1.5"/><circle cx="8" cy="13" r="1.5"/><path d="M4 4.5 V7 A4 4 0 0 0 8 11 V11.5"/><path d="M12 4.5 V7 A4 4 0 0 1 8 11"/></svg></span>
        Fork
      </button>
      <button type="button" class="sheet-row danger" id="msg-sheet-delete">
        <span class="sheet-icon"><svg viewBox="0 0 24 24" width="1.05rem" height="1.05rem" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.8A1.8 1.8 0 0 1 10.8 3h2.4A1.8 1.8 0 0 1 15 4.8V7"/><path d="M6 7l1 12.5A1.8 1.8 0 0 0 8.8 21h6.4a1.8 1.8 0 0 0 1.8-1.5L18 7"/><path d="M10 11v6M14 11v6"/></svg></span>
        Delete
      </button>
    </div>
  </div>

  <div id="messages"><p id="empty">No messages yet.</p></div>

  <div id="composer">
    <div id="attach-chip-row" hidden></div>
    <form id="reply-form">
      <input type="file" id="attach-file-input" multiple hidden />
      <button type="button" id="plus-button" title="Attach files">＋</button>
      <div id="attach-menu" hidden>
        <button type="button" class="attach-menu-row" id="attach-menu-camera">
          <span class="attach-menu-icon"><svg viewBox="0 0 24 24" width="1.15rem" height="1.15rem" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.2l1-1.6A1.8 1.8 0 0 1 9.7 3.5h4.6a1.8 1.8 0 0 1 1.5.9L16.8 6H18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/><circle cx="12" cy="13" r="3.4"/></svg></span>
          Camera
        </button>
        <button type="button" class="attach-menu-row" id="attach-menu-photos">
          <span class="attach-menu-icon"><svg viewBox="0 0 24 24" width="1.15rem" height="1.15rem" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M20.5 15.5 15.8 11a1.5 1.5 0 0 0-2.15.06L8 17"/></svg></span>
          Photos
        </button>
        <button type="button" class="attach-menu-row" id="attach-menu-files">
          <span class="attach-menu-icon"><svg viewBox="0 0 24 24" width="1.15rem" height="1.15rem" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7.5 9.4 15.1a3 3 0 0 1-4.24-4.24L13.5 2.5a2 2 0 0 1 2.83 2.83L8.5 13.2a1 1 0 0 1-1.41-1.41L14 5"/></svg></span>
          Files
        </button>
      </div>
      <textarea id="reply-text" placeholder="Message..." rows="1"></textarea>
      <button type="submit" id="send-button" title="Send">↑</button>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
