<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agora</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" />
  <style>
    /* Visual redesign 2026-07-20, modeled on the ChatGPT mobile app
       (Edvard's reference screenshots): plain-text assistant replies (no
       bubble), a slide-in drawer for conversation switching/search instead
       of a header dropdown, a bottom-sheet action menu per conversation,
       icon-only message actions, and a pill-shaped input bar. Same
       light/dark theme variables as before, tuned to look closer to the
       reference (neutral gray user bubble, not blue — blue reserved for
       the send button and other single primary actions). */
    :root, :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #131314;
      --bg-raised: #1e1f20;
      --bg-input: #242426;
      --border: #2c2d2f;
      --text: #e8e8e8;
      --text-dim: #9a9a9a;
      --text-dimmer: #6b6b6b;
      --accent: #2563eb;
      --bubble-mine: #2c2d2f;
      --danger: #f87171;
      --overlay: rgba(0,0,0,0.55);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --bg-raised: #ffffff;
      --bg-input: #f4f4f5;
      --border: #e5e5e7;
      --text: #1a1a1a;
      --text-dim: #6b6b6b;
      --text-dimmer: #a0a0a3;
      --accent: #2563eb;
      --bubble-mine: #f0f0f1;
      --danger: #dc2626;
      --overlay: rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* --- Top bar ---------------------------------------------------- */
    header {
      padding: 0.6rem 0.75rem;
      flex: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .round-button {
      flex: none;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      border: none;
      background: none;
      color: var(--text);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .round-button:hover { background: var(--bg-input); }
    #header-title {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status { display: none; } /* transient status now shown as a toast-ish line under the title on demand */
    #status.visible {
      display: block;
      position: absolute;
      top: 3rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    /* --- Drawer ------------------------------------------------------ */
    #drawer-scrim {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 20;
    }
    #drawer-scrim[hidden] { display: none; }
    #drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: min(85vw, 320px);
      background: var(--bg-raised);
      border-right: 1px solid var(--border);
      z-index: 21;
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
      gap: 0.5rem;
    }
    #drawer[hidden] { display: none; }
    .drawer-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.4rem 0.6rem;
    }
    .drawer-header h1 { font-size: 1.05rem; margin: 0; flex: 1; }
    #drawer-search-input {
      width: 100%;
      border-radius: 0.7rem;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      padding: 0.5rem 0.7rem;
      font: inherit;
      font-size: 0.85rem;
    }
    #drawer-new-chat {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-radius: 0.7rem;
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 0.55rem 0.8rem;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .drawer-section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-dimmer);
      padding: 0.6rem 0.5rem 0.2rem;
    }
    #drawer-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }
    .drawer-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-radius: 0.6rem;
      padding: 0.55rem 0.5rem;
      cursor: pointer;
    }
    .drawer-row:hover { background: var(--bg-input); }
    .drawer-row.active { background: var(--bg-input); }
    .drawer-row-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.88rem;
    }
    .drawer-row-more {
      flex: none;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
      cursor: pointer;
      border-radius: 0.4rem;
    }
    .drawer-row-more:hover { background: var(--border); }
    #drawer-search-results { display: flex; flex-direction: column; gap: 0.1rem; }
    .search-hit {
      display: flex;
      flex-direction: column;
      border-radius: 0.6rem;
      padding: 0.5rem;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .search-hit:hover { background: var(--bg-input); }
    .search-hit .hit-name { font-weight: 600; font-size: 0.72rem; color: var(--text-dim); }
    .drawer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem;
      border-top: 1px solid var(--border);
    }
    .drawer-footer button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 0.6rem;
      padding: 0.4rem 0.7rem;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* --- Bottom sheet (conversation actions) -------------------------- */
    .sheet-scrim {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 30;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-scrim[hidden] { display: none; }
    .sheet {
      width: 100%;
      max-width: 480px;
      background: var(--bg-raised);
      border-radius: 1.1rem 1.1rem 0 0;
      padding: 0.5rem 0 1.2rem;
      max-height: 85vh;
      overflow-y: auto;
    }
    .sheet-title {
      font-size: 0.85rem;
      color: var(--text-dim);
      padding: 0.8rem 1.1rem 0.4rem;
      font-weight: 600;
    }
    .sheet-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      padding: 0.75rem 1.1rem;
      font: inherit;
      font-size: 0.92rem;
      text-align: left;
      cursor: pointer;
    }
    .sheet-row:hover { background: var(--bg-input); }
    .sheet-row.danger { color: var(--danger); }
    .sheet-row .sheet-icon { width: 1.3rem; text-align: center; flex: none; }

    /* --- Modal (edit conversation / new chat) ------------------------- */
    .modal-scrim {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-scrim[hidden] { display: none; }
    .modal {
      width: 100%;
      max-width: 420px;
      background: var(--bg-raised);
      border-radius: 1rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal h2 { margin: 0 0 0.2rem; font-size: 1rem; }
    .modal input,
    .modal textarea,
    .modal select {
      width: 100%;
      border-radius: 0.7rem;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      padding: 0.5rem 0.7rem;
      font: inherit;
      font-size: 0.9rem;
      resize: none;
    }
    .modal-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .modal-row select { flex: 1; min-width: 0; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .checkbox-row[hidden] { display: none; }
    .checkbox-row input { width: 1rem; height: 1rem; }
    .capability-badge {
      font-size: 0.7rem;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.15rem 0.4rem;
      white-space: nowrap;
    }
    .template-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .template-chip {
      font-size: 0.75rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 1rem;
      padding: 0.25rem 0.65rem;
      cursor: pointer;
    }
    .modal-status { font-size: 0.75rem; color: var(--text-dim); min-height: 1em; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.2rem; }
    .modal-actions button {
      border: none;
      border-radius: 0.8rem;
      padding: 0.55rem 1rem;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--bg-input); color: var(--text); }

    /* --- Messages ------------------------------------------------------ */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .msg-block { display: flex; flex-direction: column; }
    .msg-block.mine { align-items: flex-end; }
    .msg-block.theirs { align-items: stretch; }
    .msg-meta {
      font-size: 0.7rem;
      color: var(--text-dimmer);
      margin-bottom: 0.2rem;
    }
    .msg-block.mine .msg-meta { text-align: right; }
    .msg-bubble.mine {
      max-width: 82%;
      background: var(--bubble-mine);
      color: var(--text);
      border-radius: 1.1rem;
      padding: 0.55rem 0.9rem;
      line-height: 1.4;
      word-break: break-word;
      font-size: 0.95rem;
    }
    /* Assistant replies render as plain text, no bubble, full column
       width — matches the reference screenshots directly. */
    .msg-plain {
      color: var(--text);
      line-height: 1.5;
      word-break: break-word;
      font-size: 0.95rem;
    }
    .msg-plain p { margin: 0 0 0.5rem; }
    .msg-plain p:last-child { margin-bottom: 0; }
    .msg-plain pre {
      background: var(--bg-input);
      padding: 0.6rem;
      border-radius: 0.6rem;
      overflow-x: auto;
      font-size: 0.8rem;
      margin: 0.4rem 0;
    }
    .msg-plain code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .msg-plain :not(pre) > code { background: var(--bg-input); padding: 0.1rem 0.3rem; border-radius: 0.3rem; }
    .msg-plain a { color: var(--accent); text-decoration: underline; }
    .msg-actions {
      display: flex;
      gap: 0.15rem;
      margin-top: 0.3rem;
    }
    .msg-block.mine .msg-actions { justify-content: flex-end; }
    .msg-actions button {
      background: none;
      border: none;
      color: var(--text-dimmer);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.25rem 0.4rem;
      border-radius: 0.4rem;
      line-height: 1;
    }
    .msg-actions button:hover { background: var(--bg-input); color: var(--text); }
    .msg-edit-area {
      width: 100%;
      font: inherit;
      font-size: 0.95rem;
      border-radius: 1.1rem;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      padding: 0.55rem 0.9rem;
      resize: none;
    }
    .typing-indicator { color: var(--text-dim); font-size: 0.8rem; padding: 0 0.2rem; max-width: 720px; width: 100%; margin: 0 auto; }
    .retry-banner {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 0.7rem;
      padding: 0.5rem 0.7rem;
      font-size: 0.8rem;
      color: var(--text-dim);
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .retry-banner select { font: inherit; background: var(--bg-input); color: var(--text); border: 1px solid var(--border); border-radius: 0.4rem; }
    .retry-banner button { font: inherit; background: var(--accent); color: #fff; border: none; border-radius: 0.4rem; padding: 0.25rem 0.6rem; cursor: pointer; }
    #empty { color: var(--text-dimmer); text-align: center; margin-top: 2rem; font-size: 0.9rem; }

    /* --- Input bar ------------------------------------------------------ */
    #composer {
      flex: none;
      padding: 0.6rem 0.75rem 0.85rem;
    }
    #reply-form {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 0.4rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 1.6rem;
      padding: 0.4rem 0.4rem 0.4rem 0.6rem;
      position: relative;
    }
    #plus-button, #send-button {
      flex: none;
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }
    #plus-button { background: none; color: var(--text-dim); }
    #plus-button:hover { background: var(--border); }
    #send-button { background: var(--accent); color: #fff; }
    #send-button:disabled { opacity: 0.4; cursor: default; }
    textarea#reply-text {
      flex: 1;
      resize: none;
      max-height: 8rem;
      min-height: 2.2rem;
      overflow-y: auto;
      border: none;
      background: none;
      color: var(--text);
      padding: 0.35rem 0.2rem;
      font: inherit;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    textarea#reply-text:focus { outline: none; }
    #model-popover {
      position: absolute;
      bottom: calc(100% + 0.4rem);
      left: 0.4rem;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      padding: 0.6rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      z-index: 10;
      min-width: 220px;
    }
    #model-popover[hidden] { display: none; }
    #model-popover label { font-size: 0.72rem; color: var(--text-dim); display: block; margin-bottom: 0.3rem; }
    #model-popover select { width: 100%; border-radius: 0.6rem; border: 1px solid var(--border); background: var(--bg-input); color: var(--text); padding: 0.4rem; font: inherit; font-size: 0.82rem; }
  </style>
</head>
<body>
  <header>
    <button type="button" class="round-button" id="drawer-open" aria-label="Menu">☰</button>
    <div id="header-title">Main</div>
    <button type="button" class="round-button" id="header-new-chat" aria-label="New chat" title="New chat">✎</button>
    <button type="button" class="round-button" id="header-overflow" aria-label="Conversation actions" title="Conversation actions">⋮</button>
  </header>
  <span id="status"></span>

  <div id="drawer-scrim" hidden></div>
  <nav id="drawer" hidden>
    <div class="drawer-header">
      <h1>Agora</h1>
      <button type="button" class="round-button" id="drawer-close" aria-label="Close menu">✕</button>
    </div>
    <input id="drawer-search-input" type="text" placeholder="Search conversations and messages" />
    <button type="button" id="drawer-new-chat">＋ New chat</button>
    <div id="drawer-search-results" hidden></div>
    <div id="drawer-list-wrap">
      <div class="drawer-section-label">Conversations</div>
      <div id="drawer-list"></div>
    </div>
    <div class="drawer-footer">
      <button type="button" id="theme-toggle">Toggle theme</button>
    </div>
  </nav>

  <div class="sheet-scrim" id="action-sheet-scrim" hidden>
    <div class="sheet" id="action-sheet">
      <div class="sheet-title" id="action-sheet-title">Conversation</div>
      <button type="button" class="sheet-row" id="sheet-edit"><span class="sheet-icon">✎</span> Edit (name, personality, model)</button>
      <button type="button" class="sheet-row" id="sheet-archive"><span class="sheet-icon">⧉</span> <span id="sheet-archive-label">Archive</span></button>
      <button type="button" class="sheet-row danger" id="sheet-delete"><span class="sheet-icon">🗑</span> Delete</button>
    </div>
  </div>

  <div class="modal-scrim" id="edit-modal-scrim" hidden>
    <form class="modal" id="edit-modal">
      <h2>Edit conversation</h2>
      <input id="edit-name" type="text" placeholder="Name" />
      <div class="template-row" id="edit-template-row"></div>
      <textarea id="edit-personality" placeholder="Personality / system prompt..." rows="3"></textarea>
      <div class="modal-row">
        <select id="edit-model"></select>
        <span class="capability-badge" id="edit-badge"></span>
      </div>
      <label class="checkbox-row" id="edit-thinking-row">
        <input type="checkbox" id="edit-thinking" />
        Thinking
      </label>
      <p class="modal-status" id="edit-status"></p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="edit-cancel">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>

  <div class="modal-scrim" id="new-chat-modal-scrim" hidden>
    <form class="modal" id="new-chat-modal">
      <h2>New conversation</h2>
      <input id="new-chat-name" type="text" placeholder="Name (e.g. Marcus)" required />
      <div class="template-row" id="new-chat-template-row"></div>
      <textarea id="new-chat-personality" placeholder="Personality / system prompt (optional)..." rows="3"></textarea>
      <div class="modal-row">
        <select id="new-chat-model"></select>
        <span class="capability-badge" id="new-chat-badge"></span>
      </div>
      <label class="checkbox-row" id="new-chat-thinking-row">
        <input type="checkbox" id="new-chat-thinking" />
        Thinking
      </label>
      <p class="modal-status" id="new-chat-status"></p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="new-chat-cancel">Cancel</button>
        <button type="submit" class="btn-primary">Create</button>
      </div>
    </form>
  </div>

  <div id="messages"><p id="empty">No messages yet.</p></div>

  <div id="composer">
    <form id="reply-form">
      <button type="button" id="plus-button" title="Model for this message">＋</button>
      <div id="model-popover" hidden>
        <label>Send with a different model</label>
        <select id="reply-model"></select>
      </div>
      <textarea id="reply-text" placeholder="Message..." rows="1"></textarea>
      <button type="submit" id="send-button" title="Send">↑</button>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
