<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agora</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" />
  <style>
    /* Theme toggle (Phase 5, Feature-Ideas.md #10) — CSS custom properties
       swapped via a data-theme attribute on <html>, persisted in
       localStorage by app.js. Dark stays the default (matches the
       original PoC), light is opt-in. */
    :root, :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111214;
      --bg-alt: #17181b;
      --bg-input: #1a1b1e;
      --border: #26272b;
      --border-input: #333;
      --text: #e8e8e8;
      --text-dim: #8a8a8a;
      --text-dimmer: #666;
      --accent: #2563eb;
      --bubble-theirs: #262830;
      --danger: #b91c1c;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f5f7;
      --bg-alt: #ffffff;
      --bg-input: #ffffff;
      --border: #ddd;
      --border-input: #ccc;
      --text: #1a1a1a;
      --text-dim: #666;
      --text-dimmer: #999;
      --accent: #2563eb;
      --bubble-theirs: #e9e9ec;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    #status { font-size: 0.75rem; color: var(--text-dim); }
    .header-actions { display: flex; gap: 0.3rem; flex: none; }
    .icon-button {
      background: none;
      border: 1px solid var(--border-input);
      color: var(--text);
      border-radius: 0.6rem;
      padding: 0.3rem 0.5rem;
      font-size: 0.85rem;
      line-height: 1;
      cursor: pointer;
    }
    .header-conversations {
      display: flex;
      gap: 0.5rem;
    }
    #conversation-select {
      flex: 1;
      min-width: 0;
      border-radius: 0.7rem;
      border: 1px solid var(--border-input);
      background: var(--bg-input);
      color: var(--text);
      padding: 0.4rem 0.6rem;
      font: inherit;
      font-size: 0.85rem;
    }
    #new-chat-toggle, #conversation-settings-toggle {
      padding: 0.4rem 0.75rem;
      border-radius: 0.7rem;
      font-size: 0.9rem;
      line-height: 1;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      flex: none;
    }
    #conversation-settings-toggle { background: #3a3b40; }
    #search-panel, #new-chat-form, #conversation-settings-form {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-alt);
      flex: none;
    }
    #search-panel[hidden], #new-chat-form[hidden], #conversation-settings-form[hidden] { display: none; }
    #search-panel input,
    #new-chat-form input,
    #new-chat-form textarea,
    #new-chat-form select,
    #conversation-settings-form input,
    #conversation-settings-form textarea,
    #conversation-settings-form select {
      border-radius: 0.7rem;
      border: 1px solid var(--border-input);
      background: var(--bg-input);
      color: var(--text);
      padding: 0.5rem 0.7rem;
      font: inherit;
      font-size: 0.9rem;
      resize: none;
    }
    .new-chat-row, .settings-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    #new-chat-model, #settings-model { flex: 1; min-width: 0; }
    .new-chat-checkbox {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .new-chat-checkbox[hidden] { display: none; }
    .new-chat-checkbox input { width: 1rem; height: 1rem; }
    .capability-badge {
      font-size: 0.7rem;
      color: var(--text-dim);
      border: 1px solid var(--border-input);
      border-radius: 0.5rem;
      padding: 0.15rem 0.4rem;
      white-space: nowrap;
    }
    .template-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .template-chip {
      font-size: 0.75rem;
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      color: var(--text);
      border-radius: 1rem;
      padding: 0.25rem 0.65rem;
      cursor: pointer;
    }
    #new-chat-form .new-chat-actions,
    #conversation-settings-form .settings-actions {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }
    #new-chat-cancel, #settings-cancel { background: #2a2b30; color: #fff; border: none; border-radius: 0.9rem; padding: 0.6rem 1.1rem; font: inherit; cursor: pointer; }
    #settings-delete { background: var(--danger); color: #fff; border: none; border-radius: 0.9rem; padding: 0.6rem 1.1rem; font: inherit; cursor: pointer; }
    #new-chat-status, #settings-status { font-size: 0.75rem; color: var(--text-dim); min-height: 1em; }
    #search-results { display: flex; flex-direction: column; gap: 0.3rem; max-height: 40vh; overflow-y: auto; }
    .search-result {
      text-align: left;
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: 0.6rem;
      padding: 0.4rem 0.6rem;
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .search-result .conv-name { font-weight: 600; font-size: 0.75rem; color: var(--text-dim); }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .bubble-row { display: flex; align-items: flex-end; gap: 0.4rem; max-width: 100%; }
    .bubble-row.mine { flex-direction: row-reverse; align-self: flex-end; }
    .bubble-row.theirs { align-self: flex-start; }
    .avatar {
      flex: none;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
    }
    .bubble-wrap { display: flex; flex-direction: column; max-width: 78%; }
    .bubble-row.mine .bubble-wrap { align-items: flex-end; }
    .bubble {
      padding: 0.45rem 0.75rem;
      border-radius: 1rem;
      line-height: 1.35;
      word-break: break-word;
      font-size: 0.95rem;
    }
    .bubble p { margin: 0 0 0.4rem; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble pre {
      background: rgba(0,0,0,0.25);
      padding: 0.5rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      font-size: 0.8rem;
      margin: 0.3rem 0;
    }
    .bubble code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bubble :not(pre) > code { background: rgba(0,0,0,0.2); padding: 0.1rem 0.3rem; border-radius: 0.3rem; }
    .bubble a { color: inherit; text-decoration: underline; }
    .bubble .meta {
      display: block;
      font-size: 0.65rem;
      opacity: 0.65;
      margin-bottom: 0.15rem;
    }
    .bubble.mine {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 0.3rem;
    }
    .bubble.theirs {
      background: var(--bubble-theirs);
      color: var(--text);
      border-bottom-left-radius: 0.3rem;
    }
    .bubble-actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.15rem;
      font-size: 0.7rem;
    }
    .bubble-row.mine .bubble-actions { justify-content: flex-end; }
    .bubble-actions button {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.7rem;
      padding: 0.1rem 0.3rem;
    }
    .bubble-actions button:hover { color: var(--text); text-decoration: underline; }
    .typing-indicator { align-self: flex-start; color: var(--text-dim); font-size: 0.8rem; padding: 0 0.5rem; }
    .retry-banner {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      background: var(--bg-alt);
      border: 1px solid var(--border-input);
      border-radius: 0.7rem;
      padding: 0.4rem 0.6rem;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .retry-banner select { font: inherit; background: var(--bg-input); color: var(--text); border: 1px solid var(--border-input); border-radius: 0.4rem; }
    .retry-banner button { font: inherit; background: var(--accent); color: #fff; border: none; border-radius: 0.4rem; padding: 0.2rem 0.5rem; cursor: pointer; }
    #empty { color: var(--text-dimmer); text-align: center; margin-top: 2rem; font-size: 0.9rem; }
    form#reply-form {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      padding: 0.6rem;
      border-top: 1px solid var(--border);
      flex: none;
    }
    #reply-model {
      flex: none;
      max-width: 6.5rem;
      border-radius: 0.9rem;
      border: 1px solid var(--border-input);
      background: var(--bg-input);
      color: var(--text);
      font-size: 0.75rem;
      padding: 0.3rem;
    }
    textarea#reply-text {
      flex: 1;
      resize: none;
      max-height: 8rem;
      min-height: 2.3rem;
      overflow-y: auto;
      border-radius: 0.9rem;
      border: 1px solid var(--border-input);
      background: var(--bg-input);
      color: var(--text);
      padding: 0.55rem 0.85rem;
      font: inherit;
      line-height: 1.3;
    }
    textarea:focus { outline: 1px solid var(--accent); }
    button:not(.icon-button):not(.template-chip):not(.bubble-actions button) {
      border: none;
      border-radius: 0.9rem;
      background: var(--accent);
      color: #fff;
      padding: 0.6rem 1.1rem;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Agora</h1>
      <div class="header-actions">
        <button type="button" class="icon-button" id="search-toggle" title="Search">Search</button>
        <button type="button" class="icon-button" id="theme-toggle" title="Toggle theme">Theme</button>
      </div>
    </div>
    <span id="status"></span>
    <div class="header-conversations">
      <select id="conversation-select"><option value="">Main</option></select>
      <button type="button" id="conversation-settings-toggle" title="Conversation settings">⚙</button>
      <button type="button" id="new-chat-toggle" title="New chat">+ New</button>
    </div>
  </header>
  <div id="search-panel" hidden>
    <input id="search-input" type="text" placeholder="Search all conversations..." />
    <div id="search-results"></div>
  </div>
  <form id="new-chat-form" hidden>
    <input id="new-chat-name" type="text" placeholder="Name (e.g. Marcus)" required />
    <div class="template-row" id="template-row"></div>
    <textarea id="new-chat-personality" placeholder="Personality / system prompt (optional)..." rows="2"></textarea>
    <div class="new-chat-row">
      <select id="new-chat-model"></select>
      <span class="capability-badge" id="new-chat-badge"></span>
      <label id="new-chat-thinking-row" class="new-chat-checkbox">
        <input type="checkbox" id="new-chat-thinking" />
        Thinking
      </label>
    </div>
    <p id="new-chat-status"></p>
    <div class="new-chat-actions">
      <button type="button" id="new-chat-cancel">Cancel</button>
      <button type="submit">Create</button>
    </div>
  </form>
  <form id="conversation-settings-form" hidden>
    <input id="settings-name" type="text" placeholder="Name" />
    <textarea id="settings-personality" placeholder="Personality / system prompt..." rows="2"></textarea>
    <div class="settings-row">
      <select id="settings-model"></select>
      <span class="capability-badge" id="settings-badge"></span>
      <label id="settings-thinking-row" class="new-chat-checkbox">
        <input type="checkbox" id="settings-thinking" />
        Thinking
      </label>
    </div>
    <label class="new-chat-checkbox">
      <input type="checkbox" id="settings-archived" />
      Archived (hidden from the switcher)
    </label>
    <p id="settings-status"></p>
    <div class="settings-actions">
      <button type="button" id="settings-delete">Delete conversation</button>
      <div style="display:flex; gap:0.5rem;">
        <button type="button" id="settings-cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </div>
  </form>
  <div id="messages"><p id="empty">No messages yet.</p></div>
  <form id="reply-form">
    <select id="reply-model" title="Send with a different model (optional)"></select>
    <textarea id="reply-text" placeholder="Message..." rows="1"></textarea>
    <button type="submit">Send</button>
  </form>
  <script src="/app.js"></script>
</body>
</html>
