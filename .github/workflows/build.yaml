name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# One pipeline at a time per ref, because update-manifest below is a blind
# `sed` of whichever image digest its own run produced. Two merges to main in
# quick succession otherwise run their pipelines in parallel and the LAST one
# to finish wins -- which is not the same as the newest commit.
#
# Measured 2026-08-12 in agora-claude-bridge, which has the identical job.
# #41 merged at 00:18:38Z and #40 at 00:18:41Z -- three seconds apart, with
# #40 the newer of the two and carrying #41 as its parent. The config repo
# was then pinned to sha256:dd38617..., which is the image built from #41's
# commit 4ee2ff7; the image built from #40's commit f36df04 is
# sha256:49201d4... and was never deployed. Every check was green -- CI
# passed on both, both images built, ArgoCD synced -- and the deployed pod
# served a 404 for /health/database, which #40 had just added. Nothing
# anywhere reported an error. This repo has the same flaw and has only been
# lucky with merge spacing.
#
# (Those digests are the evidence, and they are checkable:
#  gh api /orgs/SokratesAI/packages/container/agora-claude-bridge/versions
#  maps sha-4ee2ff7 and sha-f36df04 to two different images.)
#
# cancel-in-progress stays false deliberately: killing a run partway through
# update-manifest is the exact failure this is meant to prevent. Queued runs
# are superseded by newer ones, so the last write is the ref's tip either way.
#
# The group is NOT simply `github.ref`, which is what the bridge and the
# runner use and what this repo's first draft copied. Unlike those, this
# workflow also builds `v*` tags, and update-manifest inherits build-push's
# `main || refs/tags/v*` condition -- so a release tag and a push to main are
# two different refs writing the SAME agora-config manifest.yaml, and a
# per-ref group leaves them free to race each other exactly as before. So:
# pull requests get a lane each (nothing else would queue every PR behind
# main), and everything that can reach update-manifest shares one.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sokratesai/agora
  CONFIG_REPO: SokratesAI/agora-config

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for org repos
        # as of the "breaking update" in its README — the underlying gitleaks CLI
        # itself is free/OSS, so run that directly instead of the Action wrapper.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --redact
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  build-push:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Commits the new image digest to agora-config, which ArgoCD's SCM Provider
      # generator auto-deploys — no platform-config PR, no manual step. Migrated
      # 2026-07-27 from the old "print the digest, bump platform-config by hand"
      # pattern: that existed because GH_BOT_TOKEN (broadly scoped) was too
      # powerful for a service this small (see whatsapp-bridge's build.yaml for
      # the same reasoning, still true there). The sokrates-ci-deployer GitHub
      # App fixes that — this step's installation token is scoped to ONLY
      # agora-config, never anything broader. ORG_APP_ID/ORG_APP_PRIVATE_KEY are
      # repo-scoped Actions secrets on this repo (not org-level — GitHub gates
      # those behind a paid plan for private repos). See the vault's
      # Platform-Product-Catalog/_context.md for the full pattern.
      #
      # This was a third job, `update-manifest`, until Cycle 224. It is a `sed`
      # and a `git push` — a few seconds of work billed as a whole minute on
      # every merge, because GitHub rounds per job, against an Actions allowance
      # the org is roughly 3x over (idea #73). It only ever ran after
      # `build-push` succeeded, so running it here as that job's last step is
      # the same order for a minute less. The config repo goes into `.config`
      # rather than the workspace root, because unlike the old job this one
      # already has this repo's own source checked out and must not clobber it.
      - name: Generate installation token scoped to agora-config only
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ORG_APP_ID }}
          private-key: ${{ secrets.ORG_APP_PRIVATE_KEY }}
          owner: SokratesAI
          repositories: agora-config
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: .config
      - name: Update image digest in manifest.yaml
        working-directory: .config
        run: |
          sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}|" manifest.yaml
          git config user.name "sokratesai-repo-committer[bot]"
          git config user.email "sokratesai-repo-committer[bot]@users.noreply.github.com"
          git add manifest.yaml
          if git diff --staged --quiet; then
            echo "no manifest change, skipping commit"
          else
            git commit -m "Update image to ${{ steps.build.outputs.digest }}"
            git push
          fi
